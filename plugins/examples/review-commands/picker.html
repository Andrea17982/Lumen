<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 14px system-ui, sans-serif; margin: 12px; }
  button { display: block; margin: 6px 0; padding: 6px 10px; }
</style>
<p>Pick a focus; Lumen puts the prompt in the composer for you to edit and send.</p>
<button data-focus="security">Security review</button>
<button data-focus="performance">Performance review</button>
<button data-focus="accessibility">Accessibility review</button>
<p id="status"></p>
<script>
  // The whole panel API is postMessage: prompt.insert and (with declared hosts) net.fetch.
  let next = 1;
  for (const button of document.querySelectorAll('button')) {
    button.onclick = () =>
      parent.postMessage(
        {
          lumen: 1,
          id: next++,
          method: 'prompt.insert',
          params: { text: `Review the current changes with a ${button.dataset.focus} focus.` },
        },
        '*',
      );
  }
  addEventListener('message', (e) => {
    if (e.data?.lumen === 1)
      document.getElementById('status').textContent = e.data.error || 'Added to the composer.';
  });
</script>
