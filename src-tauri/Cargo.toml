[package]
name = "lumen"
version = "0.12.1"
description = "Native AI sessions, optional orchestration and Moli browsing"
authors = ["Andrea17982"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-ipc = {path="crates/lumen-ipc"}
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2.3.2"
serde_json = "1"
tokio = {version="1",features= ["process", "sync", "time", "rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[workspace]
members = ["crates/lumen-core", "crates/lumen-commands", "crates/lumen-ipc", "crates/lumen-daemon"]
resolver = "2"
default-members = ["."]
