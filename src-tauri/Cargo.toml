[package]
name = "lumen"
version = "0.7.1"
description = "Native AI sessions, optional orchestration and Moli browsing"
authors = ["Andrea17982"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
uuid = { version = "1", features = ["v4"] }
which = "8"
dunce = "1"
toml = "0.8"
ignore = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
lumen-gatekeeper = { path = "../src/features/gatekeeper" }
xcap = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
axum = "0.8"
tiktoken-rs = "0.12.1"
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
