[package]
name = "lumen-daemon"
version = "0.12.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
[dependencies]
lumen-core = {path="../lumen-core"}
lumen-ipc = {path="../lumen-ipc"}
lumen-gatekeeper = {path="../lumen-gatekeeper"}
serde_json = "1"
tokio = {version="1",features=["net","io-util","sync","time","rt-multi-thread","macros"]}
dirs = "6"
[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features=["Win32_System_JobObjects","Win32_System_Threading","Win32_Security"]}
