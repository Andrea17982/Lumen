[package]
name = "lumen-core"
version = "0.16.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[dependencies]
lumen-commands = { path = "../lumen-commands" }
auto-launch = "0.6.0"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
uuid = { version = "1", features = ["v4"] }
which = "8"
dunce = "1"
toml = "0.8"
ignore = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
lumen-gatekeeper = { path = "../lumen-gatekeeper" }
xcap = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
regex = "1"
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
reqwest_mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "elicitation", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
axum = "0.8"
tiktoken-rs = "0.12.1"
rquickjs = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

