[package]
name = "lumen-ipc"
version = "0.14.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
tokio = {version="1",features=["net","io-util","time","sync","rt-multi-thread","macros"]}
sha2 = "0.11.1"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features=["Win32_Security","Win32_System_Pipes","Win32_System_Threading"]}
[target.'cfg(unix)'.dependencies]
libc = "0.2"
