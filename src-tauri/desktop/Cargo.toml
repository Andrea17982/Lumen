[package]
name = "lumen-desktop"
version = "0.12.2"
description = "Lumen desktop shell"
authors = ["Andrea17982"]
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
lumen-ipc = { path = "../crates/lumen-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-opener = "=2.7.2"
# Test builds only: an embedded W3C WebDriver server on 127.0.0.1. Never in release.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
