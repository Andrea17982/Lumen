[package]
name = "lumen-desktop"
version = "0.12.2"
description = "Lumen desktop shell"
authors = ["Andrea17982"]
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
