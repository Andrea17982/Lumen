name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles nsis
      - name: Clean Windows installer smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP 'Lumen Install Smoke'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $env:LUMEN_RELEASE_EXE = Join-Path $installRoot 'lumen.exe'
          if (!(Test-Path -LiteralPath $env:LUMEN_RELEASE_EXE)) { throw 'Installed executable missing' }
          node tests/release-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed release probe failed' }
      - name: Portable executable and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist-release/
          ./scripts/package-portable.ps1 -Executable src-tauri/target/release/lumen.exe -Moli src-tauri/resources/moli/win32-x64 -Destination ("dist-release/" + ($setup.Name -replace '-setup\.exe$', '-portable.zip'))
          $portable = Get-ChildItem dist-release/*-portable.zip | Select-Object -First 1
          $portableRoot = Join-Path $env:RUNNER_TEMP 'Lumen Portable Smoke'
          Expand-Archive -LiteralPath $portable.FullName -DestinationPath $portableRoot
          $env:LUMEN_RELEASE_EXE = Join-Path $portableRoot 'Lumen.exe'
          node tests/release-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable package probe failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/prepare-moli.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Mounted universal DMG helper smoke
        shell: bash
        run: |
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/lumen-dmg-smoke"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          export LUMEN_RELEASE_EXE=$(find "$mount" -path '*.app/Contents/MacOS/lumen' -type f -print -quit)
          test -n "$LUMEN_RELEASE_EXE"
          lipo "$LUMEN_RELEASE_EXE" -verify_arch arm64 x86_64
          arch=$(node -p 'process.arch === "arm64" ? "arm64" : "x64"')
          export LUMEN_RELEASE_MOLI=$(find "$mount" -path "*/resources/moli/darwin-$arch/moli" -type f -print -quit)
          test -n "$LUMEN_RELEASE_MOLI"
          node tests/release-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
  linux:
    # xcap/libspa need newer PipeWire headers than Ubuntu 22.04 provides.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev libwayland-dev
      - run: npm ci
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles deb,appimage
      - name: Extracted Linux package helper smoke
        shell: bash
        run: |
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test "$(dpkg-deb -f "$deb" Version)" = "$(node -p 'require("./package.json").version')"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          extract="$RUNNER_TEMP/lumen-deb-smoke"
          mkdir -p "$extract"
          dpkg-deb -x "$deb" "$extract"
          export LUMEN_RELEASE_EXE=$(find "$extract" -type f -name lumen -print -quit)
          export LUMEN_RELEASE_MOLI=$(find "$extract" -path '*/resources/moli/linux-x64/moli' -type f -print -quit)
          test -n "$LUMEN_RELEASE_EXE" && test -n "$LUMEN_RELEASE_MOLI"
          node tests/release-smoke.mjs
          appimage=$(realpath "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)")
          mkdir -p "$RUNNER_TEMP/lumen-appimage-smoke"
          cd "$RUNNER_TEMP/lumen-appimage-smoke"
          "$appimage" --appimage-extract > extract.log
          export LUMEN_RELEASE_EXE=$(find "$PWD/squashfs-root" -type f -name lumen -print -quit)
          export LUMEN_RELEASE_MOLI=$(find "$PWD/squashfs-root" -path '*/resources/moli/linux-x64/moli' -type f -print -quit)
          test -n "$LUMEN_RELEASE_EXE" && test -n "$LUMEN_RELEASE_MOLI"
          cd "$GITHUB_WORKSPACE"
          node tests/release-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release metadata and flat assets
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=$(node -p "require('./package.json').version")
          test "$version" = "$expected"
          test -f "docs/release-notes/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=docs/release-notes/$version.md" >> "$GITHUB_OUTPUT"
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            test ! -e "release-assets/$name"
            cp -- "$asset" "release-assets/$name"
          done < <(find artifacts -type f -print0)
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Keep the assembled release reviewable until its assets/checks are verified.
      - uses: softprops/action-gh-release@v2
        with:
          name: Lumen ${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
