name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: node scripts/prepare-moli.mjs
      - run: cargo build --manifest-path src-tauri/Cargo.toml -p lumen-daemon --locked
      - run: node tests/daemon-smoke.mjs
      - run: node tests/docs-check.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
  web:
    # Client checks. Screenshot baselines are recorded on Windows, and Edge is preinstalled there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/desktop
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The daemon UI test drives the real service with the offline CLI fixtures.
      - run: node scripts/prepare-moli.mjs
      - run: cargo build --manifest-path src-tauri/Cargo.toml -p lumen-daemon --locked
      - run: npx playwright test
      # A failing UI test leaves its page snapshot and screenshot for diagnosis.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      # The desktop shell sits outside the Cargo workspace (WebView and dist/ dependencies).
      - run: node scripts/prepare-daemon.mjs --debug
      - run: cargo fmt --manifest-path src-tauri/desktop/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/desktop/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/desktop/Cargo.toml --all-targets --locked --features webdriver -- -D warnings
      # The real app over its embedded WebDriver server (test build only): sidecar start and crash recovery.
      - run: npx tauri build --debug --no-bundle --features webdriver --config src-tauri/desktop/tauri.conf.json
      - run: node tests/app/desktop.mjs
      - run: node tests/app/transcript-uia.mjs
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev libwayland-dev
      - run: node scripts/prepare-moli.mjs
      - run: cargo build --manifest-path src-tauri/Cargo.toml -p lumen-daemon --locked
      - run: node tests/daemon-smoke.mjs
      - run: node tests/docs-check.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
